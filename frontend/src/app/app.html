<div class="app-layout">
  <header class="header" role="banner">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">✨</span>
      <h1>Agent Flow</h1>
    </div>
  </header>

  <main class="main-content" role="main">
    <div class="left-panel">
      <app-prompt (run)="onRun($event)"></app-prompt>

      <div class="status-panel" aria-live="polite">
        <h3>Execution Status</h3>
        <p class="status-text" [class]="status().toLowerCase()">{{ status() }}</p>
      </div>
    </div>

    <div class="right-panel" role="region" aria-label="Graph Visualization">
      @defer (on viewport) {
        <app-graph [nodes]="nodes()" [links]="edges()"></app-graph>
      } @placeholder {
        <div style="color: var(--color-text-secondary); padding: var(--spacing-8); text-align: center; border: 2px dashed var(--color-border); border-radius: 8px; font-weight: 500;" role="status" aria-busy="true">
          Loading graph visualization...
        </div>
      }
    </div>
  </main>
</div>
