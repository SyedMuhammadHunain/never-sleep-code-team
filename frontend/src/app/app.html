<div class="app-layout">
  <app-toast></app-toast>
  <header class="header" role="banner">
    <div class="header-actions">
      <app-theme-toggle></app-theme-toggle>
    </div>
  </header>

  <main class="main-content" role="main">
    <div class="logs-overlay" *ngIf="logs().length > 0">
      <div class="logs-content">
        @for (log of logs(); track $index) {
          <span style="white-space: pre-wrap;">{{ log }}</span>
        }
      </div>
    </div>

    <app-prompt [isWaitingForInput]="isWaitingForInput()" (run)="onRun($event)"></app-prompt>

    @if (status() === 'Running' && nodes().length === 0) {
      <app-skeleton></app-skeleton>
    } @else {
      @defer (on viewport) {
        <app-graph [nodes]="nodes()" [links]="edges()"></app-graph>
      } @placeholder {
        <div style="color: var(--color-text-secondary); padding: var(--spacing-8); text-align: center; border: 2px dashed var(--color-border); border-radius: 8px; font-weight: 500;" role="status" aria-busy="true">
          Loading graph visualization...
        </div>
      }
    }
  </main>
</div>
