<main class="container">
  <div class="prompt-box" style="margin-top: 20vh; text-align: center;">
    <h1>Never Sleep Code Team</h1>
    <p>Enter your prompt to start the agent.</p>

    <div class="input-group" style="display: flex; gap: 16px; align-items: baseline; justify-content: center; max-width: 600px; margin: 0 auto;">
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Type a task for the agent...</mat-label>
        <input matInput type="text" [ngModel]="prompt()" (ngModelChange)="prompt.set($event)" (keydown.enter)="submitPrompt()">
      </mat-form-field>
      <button mat-flat-button color="primary" style="height: 56px;" (click)="submitPrompt()" [disabled]="!prompt().trim()">
        Send
      </button>
    </div>
  </div>
</main>
