<div class="canvas-page">
  <div class="canvas-viewport">
    <vflow [nodes]="nodes()" [edges]="edges()" background="transparent">
      <ng-template nodeHtml let-ctx>
        <div class="node-container" style="position: relative; width: 100%; height: 100%;">
          <mat-card class="node-card" style="width: 100%; height: 100%; box-sizing: border-box; margin: 0; padding: 0;">
            <mat-card-header class="node-header">
              <mat-card-title>{{ $any(ctx.node.data)()?.title }}</mat-card-title>
            </mat-card-header>
            <mat-card-content class="node-content">
              ID: {{ ctx.node.id }}
            </mat-card-content>
          </mat-card>
          <!-- Handles placed at the node container level -->
          <handle [type]="'source'" [position]="'bottom'"></handle>
          <handle [type]="'target'" [position]="'top'"></handle>
        </div>
      </ng-template>
    </vflow>
  </div>

  <div class="status-panel">
    @if (error()) {
      <div class="error-banner">
        <strong>Error:</strong> {{ error() }}
      </div>
    }

    @if (loading() && !output() && !error()) {
      <div class="loading-state">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Processing workflow...</p>
      </div>
    } @else if (output()) {
      <div class="output-box">
        <h3>Agent Output:</h3>
        <pre>{{ output() }}</pre>
      </div>
    }
  </div>

  <div class="bottom-prompt">
    <div class="input-group">
      <mat-form-field appearance="outline" class="prompt-input">
        <mat-label>Follow up with the agent...</mat-label>
        <input matInput type="text" [ngModel]="prompt()" (ngModelChange)="prompt.set($event)" (keydown.enter)="submitPrompt()" [disabled]="loading()">
      </mat-form-field>

      <button mat-flat-button color="primary" class="submit-button" (click)="submitPrompt()" [disabled]="loading() || !prompt().trim()">
        @if (loading()) {
          <mat-spinner diameter="20" class="btn-spinner"></mat-spinner>
          Running...
        } @else {
          Send
        }
      </button>
    </div>
  </div>
</div>
