[project]
name = "never-sleep-code-team"
version = "0.1.0"
description = "A graph workflow agent project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.138.0",
    "gcsfs>=2024.11.0",
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-genai>=0.2.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
lint = ["ruff", "mypy", "codespell", "ty"]
eval = ["google-adk[eval]"]
