[project]
name = "never-sleep-code-team"
version = "0.1.0"
description = "A graph workflow agent project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gcsfs>=2024.11.0",
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-genai>=0.2.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
lint = ["ruff", "mypy", "codespell", "ty"]
eval = ["google-adk[eval]"]
